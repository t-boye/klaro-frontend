        "operatingSystem": "Web",
        "inLanguage": ["en", "ak", "ee", "dag", "ha", "gaa", "fan"],

          "@type": "Offer",
          "price": "0",

        "creator": {
          "@type": "Organization",
          "name": "Klaro Technologies",
          "url": "https://klaro.app",
          "areaServed": [
            { "@type": "Country", "name": "Ghana" },

    <!-- ── Structured data: FAQ ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Klaro?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Klaro is Ghana's #1 AI-powered legal document explainer. It reads your contracts, land agreements, loan forms and tenancy agreements and explains every clause in plain, simple language — so you know exactly what you are signing."
            }
          },
          {
            "@type": "Question",
            "name": "Is Klaro available in local Ghanaian languages?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Klaro supports 7 languages including English, Twi, Ga, Ewe, Dagbani, Hausa and Fante — making it the most accessible legal AI tool in Ghana and West Africa."
            }
          },
          {
            "@type": "Question",
            "name": "How much does Klaro cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Klaro offers 3 free document analyses with no credit card required. Paid plans start with pay-per-document options and monthly subscriptions priced in Ghana Cedis (GHS)."
            }
          },
          {
            "@type": "Question",
            "name": "Is Klaro safe for sensitive legal documents?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Klaro uses secure, encrypted document processing. Your documents are analyzed privately and are not used to train any AI model."
            }
          }
        ]
      }
    </script>
